name: CI

on:
  push:
    branches: [main, 'phase-*/**']
  pull_request:
    branches: [main]

# A government-facing app should never deploy on an unverified commit.
# Every job below is a merge gate.
jobs:
  verify:
    name: Type check, test and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Type check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Engine test suite
        run: npx tsx lib/__tests__/engines.test.ts

      # A known vulnerability in a production dependency must fail the merge, not be
      # discovered in an audit later.
      - name: Dependency audit
        run: npm audit --audit-level=high

      - name: Production build
        env:
          NEXT_DIST_DIR: /tmp/next-build
          NEXT_TELEMETRY_DISABLED: 1
        run: npx next build

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # A committed credential must fail the build, not be found later in an audit.
      - name: Scan for credential patterns
        run: |
          set +e
          PATTERN='(AIza[0-9A-Za-z_-]{30,}|sk-[A-Za-z0-9]{20,}|-----BEGIN [A-Z ]*PRIVATE KEY-----|AKIA[0-9A-Z]{16})'
          MATCHES=$(grep -rInE "$PATTERN" . \
            --exclude-dir=.git \
            --exclude-dir=node_modules \
            --exclude='*.md' \
            --exclude='.env.example' \
            --exclude='ci.yml')
          if [ -n "$MATCHES" ]; then
            echo "::error::Possible committed credential detected"
            echo "$MATCHES"
            exit 1
          fi
          echo "No credential patterns found."

      # Checks every directory, not just the repository root — the frontend holds the
      # database URL and the session signing keys.
      - name: Verify no .env file is tracked
        run: |
          TRACKED=$(git ls-files | grep -E '(^|/)\.env(\..*)?$' | grep -v '\.env\.example$' || true)
          if [ -n "$TRACKED" ]; then
            echo "::error::A .env file is tracked in git — remove it and rotate the credentials"
            echo "$TRACKED"
            exit 1
          fi
          echo "No .env file is tracked."
